name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: aws-actions/setup-sam@v2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: sam build
        run: sam build

      # The OAuth issuer (advertised to MCP clients) is the API's own URL. Read it from the
      # existing stack instead of trusting each request's Host header; empty on a first
      # deploy, when the API code falls back to the request.
      - name: Resolve OAuth issuer
        id: issuer
        run: |
          API_ID=$(aws cloudformation describe-stack-resource --stack-name finance-app \
            --logical-resource-id ServerlessHttpApi \
            --query StackResourceDetail.PhysicalResourceId --output text 2>/dev/null || true)
          if [[ "$API_ID" =~ ^[a-z0-9]+$ ]]; then
            echo "url=https://${API_ID}.execute-api.us-east-1.amazonaws.com" >> "$GITHUB_OUTPUT"
          fi

      - name: sam deploy
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          OAUTH_ISSUER: ${{ steps.issuer.outputs.url }}
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "SupabaseProjectRef=lvkfyupzdkjxrisgapti JwtIssuer=finance-api JwtAudience=finance-app PostgresPassword=${POSTGRES_PASSWORD} JwtKey=${JWT_KEY}${OAUTH_ISSUER:+ OAuthIssuer=${OAUTH_ISSUER}}"

      # Old deploy zips pile up in the SAM bucket; keep only the deployed one.
      # A failed cleanup shouldn't mark the deploy as failed.
      - name: Clean up old SAM artifacts
        continue-on-error: true
        run: bash scripts/cleanup-sam-artifacts.sh finance-app finance-app
